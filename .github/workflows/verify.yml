name: Verify exercises

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: "ex*/go.mod"
      - name: Verify every chapter
        run: ./scripts/verify.sh

  agentic-training-public:
    name: Agentic training public project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install public project
        working-directory: projects/verifier-guided-agentic-training
        run: python -m pip install -e .
      - name: Run public project tests
        working-directory: projects/verifier-guided-agentic-training
        run: python -m unittest discover -s tests -v
      - name: Run public demo
        working-directory: projects/verifier-guided-agentic-training
        run: python examples/demo.py
